name: Build & Push Backend Docker Image

on:
  push:
    branches: [main]
    paths:
      - "Pipeline/**"
      - ".github/workflows/build-backend.yml"
  workflow_dispatch: # Allow manual trigger

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Lowercase owner name
        id: owner
        run: echo "name=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: Pipeline
          push: true
          tags: |
            ghcr.io/${{ steps.owner.outputs.name }}/x-cv-backend:latest
            ghcr.io/${{ steps.owner.outputs.name }}/x-cv-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
